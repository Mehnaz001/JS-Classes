<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - E-commerce</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="navbar">
        <a href="#" class="logo">Shop<span>Ease.</span></a>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search products..">
            <button>Search</button>
        </div>

        <button class="cart-btn">Cart <span id="cartCount">0</span></button>
    </header>

    <section class="hero">
        <div>
            <p class="eyebrow">YOUR EVERYDAY STORE</p>
            <h1>Find your next <br>favorite thing</h1>
            <p>Discover products you'll love at great prices.</p>
            <a href="#products" class="shop-btn">Shop now</a>
        </div>
    </section>

    <main class="container" id="products">
        <div>
            <div class="section-heading">
                <p class="eyebrow">OUR COLLECTION</p>
                <h2>Feature Products</h2>
                <p>Loading products...</p>
            </div>
        </div>

        <div id="product-container"></div>
    </main>

    <script src="script.js"></script>
</body>

</html>
